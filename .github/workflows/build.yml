name: Build playoff leaderboards

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      replay_season:
        description: "Optional: replay a season's playoff milestones into the feed (e.g. 2026)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: milestones-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # TEMPORARY, branch only. A live box score from cdn.nba.com answered
      # 200 on Alberto's machine while the scoreboard and the static schedule
      # 403 — so the block is per-path, not per-host. Map which paths a
      # RUNNER can reach, since that decides whether the overlay can stay
      # here or must move to his machine. ::error:: because logs are
      # unreadable from this session.
      - name: Path map probe
        run: |
          p () { echo "::error::PROBE $1 -> $2"; }
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          C="curl -s -m 20 -o /dev/null -w %{http_code} -A $UA -H Referer:https://www.nba.com/"
          p "cdn liveData boxscore (LIVE GAME)" "$($C https://cdn.nba.com/static/json/liveData/boxscore/boxscore_0012600015.json || echo ERR)"
          p "cdn liveData todaysScoreboard" "$($C https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json || echo ERR)"
          p "cdn liveData dated scoreboard" "$($C https://cdn.nba.com/static/json/liveData/scoreboard/scoreboard_20261010.json || echo ERR)"
          p "cdn staticData schedule_1" "$($C https://cdn.nba.com/static/json/staticData/scheduleLeagueV2_1.json || echo ERR)"
          p "cdn liveData playbyplay" "$($C https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_0012600015.json || echo ERR)"
          p "cdn liveData odds todaysOdds" "$($C https://cdn.nba.com/static/json/liveData/odds/odds_todaysGames.json || echo ERR)"
          p "stats scoreboardv3" "$($C 'https://stats.nba.com/stats/scoreboardv3?GameDate=2026-10-10&LeagueID=00' || echo ERR)"
        continue-on-error: true

      - name: Build
        env:
          REPLAY_SEASON: ${{ github.event.inputs.replay_season }}
        run: python scripts/build_milestones.py
      - name: Commit & push if changed
        run: |
          git config user.name "milestones-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "Leaderboards update $(date -u +'%F %H:%M')"; git push; fi
      # Runs AFTER the commit on purpose: the health block must reach the repo
      # before the run goes red, so there is a record either way. Without this
      # step a refused feed is indistinguishable from a day with no games.
      - name: Live feed health gate
        run: |
          python - <<'PY'
          import json, sys
          f = (json.load(open("data/leaderboards_live.json")) or {}).get("feed") or {}
          if f.get("ok"):
              print(f"live feed OK - {f.get('games_seen',0)} game(s) {f.get('by_type')}")
              sys.exit(0)
          msg = (f"cdn.nba.com refused this runner: http={f.get('http')} "
                 f"since {f.get('down_since')} (last OK {f.get('last_ok_utc')})")
          if f.get("newly_broken"):
              print(f"::error::{msg}")      # red run + email, once, on the break
              sys.exit(1)
          print(f"::warning::{msg} - still down, alarm already raised")
          sys.exit(0)
          PY
