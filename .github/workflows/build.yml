name: Build leaderboards

# No schedule. Since 2026-10-10 cdn.nba.com refuses GitHub runners and
# stats.nba.com refuses datacenter IPs, so a runner can reach neither the
# slate nor the live box scores, and the box-score archive has no
# current-season files. The live board is built on Alberto's machine by
# scripts/build_milestones.py --archive ... --push (see README).
#
# What a runner can still do is rebuild from what the archive repo holds:
# the playoff board, a replay, or the regular-season board once the archive
# has the season. A regular-season run that reaches no current-season data
# refuses to write rather than replace the local board.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "regular, playoffs or auto"
        required: false
        default: "auto"
      replay_season:
        description: "Optional: replay a season's milestones into the feed (season end year, e.g. 2027)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: milestones-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        env:
          MODE: ${{ github.event.inputs.mode }}
          REPLAY_SEASON: ${{ github.event.inputs.replay_season }}
        run: python scripts/build_milestones.py
      - name: Commit & push if changed
        run: |
          git config user.name "milestones-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "Leaderboards update $(date -u +'%F %H:%M')"; git push; fi
