name: Build playoff leaderboards

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      replay_season:
        description: "Optional: replay a season's playoff milestones into the feed (e.g. 2026)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: milestones-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # TEMPORARY, branch only. ROUND 3: the earlier runner probe sent the
      # LEAN header set and got 403 everywhere. On Alberto's machine the same
      # path answered 200 when the stats-flavoured headers were used. So the
      # question is no longer only "which path" but "which headers" -- and
      # whether the runner's 403 was ever an IP block at all.
      - name: Header x path probe
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          LEAN = {"User-Agent": UA, "Referer": "https://www.nba.com/",
                  "Origin": "https://www.nba.com",
                  "Accept": "application/json, text/plain, */*"}
          STATS = dict(LEAN, **{"Accept-Language": "en-US,en;q=0.9",
                                "x-nba-stats-origin": "stats",
                                "x-nba-stats-token": "true",
                                "Connection": "keep-alive"})
          C = "https://cdn.nba.com/static/json"
          paths = [("boxscore", f"{C}/liveData/boxscore/boxscore_0012600015.json"),
                   ("todaysScoreboard", f"{C}/liveData/scoreboard/todaysScoreboard_00.json"),
                   ("schedule_1", f"{C}/staticData/scheduleLeagueV2_1.json")]
          for pname, u in paths:
              for hname, h in (("lean", LEAN), ("stats", STATS)):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(u, headers=h), timeout=20) as r:
                          res = f"{r.getcode()} ({len(r.read()):,} bytes)"
                  except urllib.error.HTTPError as e:
                      res = f"HTTP {e.code}"
                  except Exception as e:
                      res = type(e).__name__
                  print(f"::error::PROBE {pname} + {hname} -> {res}")
          PY
        continue-on-error: true

      - name: Build
        env:
          REPLAY_SEASON: ${{ github.event.inputs.replay_season }}
        run: python scripts/build_milestones.py
      - name: Commit & push if changed
        run: |
          git config user.name "milestones-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "Leaderboards update $(date -u +'%F %H:%M')"; git push; fi
      # Runs AFTER the commit on purpose: the health block must reach the repo
      # before the run goes red, so there is a record either way. Without this
      # step a refused feed is indistinguishable from a day with no games.
      - name: Live feed health gate
        run: |
          python - <<'PY'
          import json, sys
          f = (json.load(open("data/leaderboards_live.json")) or {}).get("feed") or {}
          if f.get("ok"):
              print(f"live feed OK - {f.get('games_seen',0)} game(s) {f.get('by_type')}")
              sys.exit(0)
          msg = (f"cdn.nba.com refused this runner: http={f.get('http')} "
                 f"since {f.get('down_since')} (last OK {f.get('last_ok_utc')})")
          if f.get("newly_broken"):
              print(f"::error::{msg}")      # red run + email, once, on the break
              sys.exit(1)
          print(f"::warning::{msg} - still down, alarm already raised")
          sys.exit(0)
          PY
